<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="t">
<title id="t">Docker MCP Gateway on WSL2 architecture</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#111827}
.z{font-size:13px;font-weight:700;fill:#4b5563;letter-spacing:.04em}
.h{font-size:15px;font-weight:600}
.s{font-size:12px;fill:#4b5563}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#4b5563}
.l{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#2563eb}
.b{fill:#ffffff;stroke:#1f2937;stroke-width:1.5}
.e{fill:#eef2ff;stroke:#1f2937;stroke-width:1.5;stroke-dasharray:6 4}
.w{fill:#f3f4f6;stroke:#4b5563;stroke-width:1}
.r{stroke:#2563eb;stroke-width:2;fill:none;marker-end:url(#a)}
</style>
</defs>
<rect width="800" height="560" fill="#ffffff"/>

<rect class="w" x="20" y="20" width="440" height="520" rx="12"/>
<text class="z" x="40" y="48">WSL2 · UBUNTU · DOCKER ENGINE</text>

<rect class="b" x="60" y="70" width="360" height="56" rx="8"/>
<text class="h" x="240" y="96" text-anchor="middle">Claude Code</text>
<text class="s" x="240" y="114" text-anchor="middle">MCP server MCP_DOCKER</text>

<rect class="b" x="60" y="176" width="360" height="66" rx="8"/>
<text class="h" x="240" y="205" text-anchor="middle">mcp-gateway</text>
<text class="m" x="240" y="226" text-anchor="middle">~/.local/bin/mcp-gateway</text>

<rect class="b" x="60" y="292" width="360" height="56" rx="8"/>
<text class="h" x="240" y="317" text-anchor="middle">docker mcp gateway run</text>
<text class="m" x="240" y="335" text-anchor="middle">--servers github-official</text>

<rect class="b" x="60" y="398" width="360" height="118" rx="8"/>
<text class="h" x="240" y="424" text-anchor="middle">github-official</text>
<text class="m" x="240" y="446" text-anchor="middle">--security-opt no-new-privileges</text>
<text class="m" x="240" y="464" text-anchor="middle">--cpus 1 --memory 2Gb</text>
<text class="m" x="240" y="482" text-anchor="middle">-e GITHUB_PERSONAL_ACCESS_TOKEN</text>
<text class="m" x="240" y="503" text-anchor="middle">ghcr.io/github/github-mcp-server</text>

<rect class="w" x="490" y="20" width="290" height="160" rx="12"/>
<text class="z" x="510" y="48">WINDOWS 11</text>
<rect class="b" x="520" y="100" width="230" height="56" rx="8"/>
<text class="h" x="635" y="125" text-anchor="middle">op.exe</text>
<text class="s" x="635" y="143" text-anchor="middle">1Password CLI</text>

<rect class="e" x="490" y="236" width="290" height="96" rx="12"/>
<text class="h" x="635" y="264" text-anchor="middle">1Password service account</text>
<text class="m" x="635" y="284" text-anchor="middle">AI Agents:read_items</text>
<text class="m" x="635" y="308" text-anchor="middle">op://AI Agents/GitHub PAT</text>

<rect class="e" x="490" y="398" width="290" height="118" rx="12"/>
<text class="h" x="635" y="426" text-anchor="middle">GitHub</text>
<text class="m" x="635" y="450" text-anchor="middle">api.github.com</text>
<text class="m" x="635" y="468" text-anchor="middle">github.com</text>
<text class="m" x="635" y="486" text-anchor="middle">raw.githubusercontent.com</text>
<text class="s" x="635" y="506" text-anchor="middle">fine-grained PAT</text>

<path class="r" d="M240 126V172"/>
<text class="l" x="232" y="154" text-anchor="end">stdio · JSON-RPC</text>
<path class="r" d="M420 200H470V128H516"/>
<text class="l" x="462" y="148" text-anchor="end">OP_SERVICE_ACCOUNT_TOKEN</text>
<text class="l" x="462" y="164" text-anchor="end">WSLENV /w</text>
<path class="r" d="M635 156V232"/>
<text class="l" x="645" y="200">op read</text>
<path class="r" d="M240 242V288"/>
<text class="l" x="250" y="270">--secrets &lt;(…)</text>
<path class="r" d="M240 348V394"/>
<text class="l" x="250" y="376">github.personal_access_token</text>
<path class="r" d="M420 457H486"/>
</svg>
