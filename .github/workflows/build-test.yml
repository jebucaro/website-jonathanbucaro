name: Build and Test

on:
    pull_request:

jobs:
    build-and-validate:
        name: Build and Validate
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                  submodules: true
                  fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod

            - name: Install Hugo
              uses: peaceiris/actions-hugo@v3
              with:
                  hugo-version: 'latest'
                  extended: true

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7.1.0
              with:
                  node-version: '24.x'
                  cache: 'pnpm'
                  cache-dependency-path: '**/pnpm-lock.yaml'

            - name: Cache Hugo processed images
              uses: actions/cache@v6
              with:
                  path: resources
                  key: hugo-resources-${{ github.run_id }}
                  restore-keys: |
                      hugo-resources-

            - name: Install dependencies and build
              run: pnpm install --frozen-lockfile && pnpm run build

            - name: Verify CSP hashes for inline scripts
              run: node scripts/check-csp-hashes.mjs

            - name: Verify hero markup
              run: node scripts/check-hero.mjs

            - name: Verify structured data and llms.txt
              run: node scripts/check-structured-data.mjs

            - name: Verify llms-full.txt Markdown conversion
              run: node scripts/check-llms-fixture.mjs

            # Official Nu Html Checker (vnu), pinned by image digest. The
            # previous wrapper action bundled a 2022 vnu whose CSS checker
            # rejected valid modern CSS (size-adjust, content-visibility,
            # subgrid) in the inlined stylesheet; current vnu accepts all of
            # it, so no ignore list is needed. To update, pull
            # ghcr.io/validator/validator:latest and replace the digest.
            - name: Validate HTML5
              run: >-
                  docker run --rm -v "$PWD/public:/site:ro"
                  ghcr.io/validator/validator@sha256:292cef9f3367a6d52447c617e65c94bca04cd3399abb37bd5d17c1c7d430525a
                  java -jar /vnu.jar --skip-non-html --errors-only /site

            - name: Upload build artifacts on failure
              if: failure()
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: build-output
                  path: public/
                  retention-days: 3
