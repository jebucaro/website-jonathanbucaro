{{ define "main" }}
<div class="container">
    <div class="page-head">
        <h1 class="page-title">{{ .Title }}</h1>
        {{ if .Description }}<p class="page-description">{{ .Description }}</p>{{ end }}
    </div>
</div>
<!-- end page-head -->
<div class="projects-page container animate">
    <div class="row">
        {{ range (where .Site.RegularPages "Section" "projects" ) }}
            {{ partial "project-card.html" . }}
        {{ end }}
    </div>
</div>
{{ end }}
