{{ define "main" }}
<div class="container">
    <div class="page-head">
        <h1 class="page-title">{{ .Title }}</h1>
        {{ if .Description }}<p class="page-description">{{ .Description }}</p>{{ end }}
    </div>
</div>
<div class="projects-page container animate">
    <div class="row">
        {{ range .Pages }}
            {{ partial "project-card.html" (dict "page" . "featured" false) }}
        {{ end }}
    </div>
</div>
{{ end }}
